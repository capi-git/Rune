[package]
name = "notion2"
version = "0.1.6"
edition = "2021"
description = "A Notion-style workspace app written in Rust"

[dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }
# (See-through windows need dioxus-desktop's "transparent" feature, which is
# on by default in the copy `dioxus` brings in.)
window-vibrancy = "0.6"
raw-window-handle = "0.6"
objc2 = "0.6"
libc = "0.2"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSDate", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3.2", features = ["UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "block2"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
futures-util = "0.3"
futures-channel = "0.3"
arboard = "3"
# File pickers for export and import. The same version and features
# dioxus-desktop already uses, so nothing new is built.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# A pasted or dropped picture comes from the page as base64 text.
base64 = "0.22"

[profile.dev.package."*"]
opt-level = 2
