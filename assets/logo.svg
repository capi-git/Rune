<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Rune app icon: the R of the old rune row (three straight cuts), light on a graphite tile. Original artwork. -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3A3B3E"/>
      <stop offset="0.55" stop-color="#1D1E21"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D5D9DD"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <!-- Nothing of the rune goes left of the stem's own edge (the joint of the bowl and the leg would). -->
    <clipPath id="stem"><rect x="370" y="0" width="654" height="1024"/></clipPath>
  </defs>

  <!-- Tile shadow -->
  <rect x="75" y="89" width="874" height="874" rx="211" fill="#000000" fill-opacity="0.045"/>
  <rect x="80" y="94" width="864" height="864" rx="206" fill="#000000" fill-opacity="0.045"/>
  <rect x="85" y="99" width="854" height="854" rx="201" fill="#000000" fill-opacity="0.045"/>
  <rect x="90" y="104" width="844" height="844" rx="196" fill="#000000" fill-opacity="0.045"/>
  <rect x="95" y="109" width="834" height="834" rx="191" fill="#000000" fill-opacity="0.045"/>

  <!-- Tile -->
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>

  <!-- The rune: a stem, a pointed bowl, a leg. A soft shadow under it, then the cut itself. -->
  <g clip-path="url(#stem)">
  <path d="M404 752 V288 L630 414 L404 540 L630 752" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="68" stroke-linejoin="miter" stroke-miterlimit="6" stroke-linecap="square" transform="translate(0 10)"/>
  <path d="M404 752 V288 L630 414 L404 540 L630 752" fill="none" stroke="url(#cut)" stroke-width="68" stroke-linejoin="miter" stroke-miterlimit="6" stroke-linecap="square"/>
  </g>
</svg>
